<section class="section gender-section" id="gender">

    <div class="section-heading">
        <p>SHOP YOUR STYLE</p>
        <h2>Shop By Gender</h2>
        <span>Find the perfect style for everyone.</span>
    </div>

    <div class="gender-grid">

        <!-- MEN -->
        <div
            class="gender-card"
            role="button"
            tabindex="0"
            onclick="filterGender('Men')"
            onkeydown="if(event.key === 'Enter' || event.key === ' ') filterGender('Men')"
        >

            <div class="gender-image">
                <img
                    src="https://images.unsplash.com/photo-1617137968427-85924c800a22?auto=format&fit=crop&w=900&q=80"
                    alt="Men's Fashion"
                >
            </div>

            <div class="gender-content">
                <span>FASHION COLLECTION</span>
                <h3>Men</h3>
                <p>Shirts, jeans, shoes and accessories</p>
                <strong>Shop Men →</strong>
            </div>

        </div>


        <!-- WOMEN -->
        <div
            class="gender-card"
            role="button"
            tabindex="0"
            onclick="filterGender('Women')"
            onkeydown="if(event.key === 'Enter' || event.key === ' ') filterGender('Women')"
        >

            <div class="gender-image">
                <img
                    src="https://images.unsplash.com/photo-1483985988355-763728e1935b?auto=format&fit=crop&w=900&q=80"
                    alt="Women's Fashion"
                >
            </div>

            <div class="gender-content">
                <span>FASHION COLLECTION</span>
                <h3>Women</h3>
                <p>Dresses, tops, bags, shoes and more</p>
                <strong>Shop Women →</strong>
            </div>

        </div>


        <!-- KIDS -->
        <div
            class="gender-card"
            role="button"
            tabindex="0"
            onclick="filterGender('Kids')"
            onkeydown="if(event.key === 'Enter' || event.key === ' ') filterGender('Kids')"
        >

            <div class="gender-image">
                <img
                    src="https://images.unsplash.com/photo-1503919545889-aef636e10ad4?auto=format&fit=crop&w=900&q=80"
                    alt="Kids Fashion"
                >
            </div>

            <div class="gender-content">
                <span>FASHION COLLECTION</span>
                <h3>Kids</h3>
                <p>Fun, comfortable and stylish outfits</p>
                <strong>Shop Kids →</strong>
            </div>

        </div>

    </div>

</section>
